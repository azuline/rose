[package]
name = "rose-vfs"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "rose-vfs"
path = "src/main.rs"

[dependencies]
rose-core = { path = "../rose-core" }
fuser = { version = "0.15", default-features = false }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tempfile = "3"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
