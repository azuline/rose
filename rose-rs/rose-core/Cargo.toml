[package]
name = "rose-core"
version = "0.5.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
lofty = "0.22"
minijinja = "2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-escape = "0.1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled", "column_decltype", "functions"] }
toml = "0.8"
trash = "5"
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tracing-subscriber = "0.3"
