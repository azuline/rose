[package]
name = "rose-cli"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "rose"
path = "src/main.rs"

[dependencies]
rose-core = { path = "../rose-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process"] }
notify = "7"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
